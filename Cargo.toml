[package]
name = "lua-polars"
version = "0.9.0"
edition = "2021"
license = "BSD-3-Clause"
description = "LuaJIT DataFrame bindings over the Rust Polars engine"
repository = "https://github.com/numeric-lua/lua-polars"

[lib]
name = "polars_lua"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "0.55.2", default-features = false, features = ["lazy", "csv", "parquet", "sql", "json"] }
serde_json = "1"

[profile.release]
panic = "unwind"
