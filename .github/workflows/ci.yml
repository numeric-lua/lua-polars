name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust bridge and LuaJIT tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lua-polars
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit
      - name: Build bridge
        run: CARGO_BUILD_JOBS=1 ./scripts/build.sh
      - name: Run tests
        run: ./scripts/test.sh
